<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piyasa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #fbfbf9; --fg: #1a1a18; --mute: #8a8a84; --line: #e7e6e1; --soft: #f3f2ee;
  --up: #2f7d57; --down: #b4483f; --warn: #a1741a; --ink: #1a1a18;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --fg: #ecebe6; --mute: #7d7d77; --line: #262624; --soft: #1a1a18;
    --up: #6fbf95; --down: #e08278; --warn: #d4a94f; --ink: #ecebe6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --fg: #ecebe6; --mute: #7d7d77; --line: #262624; --soft: #1a1a18;
  --up: #6fbf95; --down: #e08278; --warn: #d4a94f; --ink: #ecebe6; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--fg); font: 400 14px/1.55 var(--font); padding-inline: 20px; padding-block: 0 80px; font-variant-numeric: tabular-nums; }
.wrap { max-width: 980px; margin-inline: auto; }
header { padding-block: 40px 8px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: baseline; }
h1 { font-size: 15px; font-weight: 600; letter-spacing: .01em; margin: 0; }
.meta { color: var(--mute); font-size: 12px; display: flex; gap: 4px 16px; flex-wrap: wrap; }
.meta b { color: var(--fg); font-weight: 500; }
nav { display: flex; flex-wrap: wrap; gap: 0 20px; border-bottom: 1px solid var(--line); margin-top: 18px; position: sticky; top: 0; background: var(--bg); z-index: 2;}
nav a { color: var(--mute); text-decoration: none; padding: 12px 0; font-size: 13px; white-space: nowrap; border-bottom: 1.5px solid transparent; margin-bottom: -1px; }
nav a.on { color: var(--fg); border-bottom-color: var(--ink); }
section.tab { display: none; }
section.tab.on { display: block; }
h2 { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 44px 0 6px; }
.sub { color: var(--mute); font-size: 12px; margin: 0 0 14px; max-width: 70ch; }
.pos { color: var(--up); } .neg { color: var(--down); } .rsk { color: var(--warn); } .neu { color: var(--mute); }
.mute { color: var(--mute); }
.tw { overflow: visible; }
table { width: 100%; border-collapse: collapse; table-layout: auto; }
th { font-weight: 400; font-size: 11px; color: var(--mute); text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: right; font-size: 13px; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td small { display: block; color: var(--mute); font-size: 11px; }
td b { font-weight: 500; }
th.s { cursor: pointer; } th.s:hover { color: var(--fg); }
svg.sp { width: 84px; height: 22px; vertical-align: middle; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 28px 24px; margin: 14px 0 6px; }
.stat .k { color: var(--mute); font-size: 12px; }
.stat .v { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.25; }
.stat .d { color: var(--mute); font-size: 12px; }
.score { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
.score .big { font-size: 64px; font-weight: 500; letter-spacing: -.04em; line-height: 1; }
.score .lab { font-size: 13px; font-weight: 500; letter-spacing: .06em; }
.comp { display: grid; grid-template-columns: 150px 1fr 34px; gap: 14px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
.comp .n { font-size: 13px; } .comp small { display: block; color: var(--mute); font-size: 11px; }
.track { height: 3px; background: var(--soft); } .track i { display: block; height: 100%; background: var(--ink); }
.note { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding-block: 11px; border-bottom: 1px solid var(--line); }
.note b { font-weight: 500; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; background: var(--mute); vertical-align: 1px; }
.dot.ok { background: var(--up); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--down); }
.fine { color: var(--mute); font-size: 12px; margin: 12px 0 0; max-width: 78ch; }
ul.src { list-style: none; padding: 0; margin: 0; } ul.src li { padding-block: 9px; border-bottom: 1px solid var(--line); color: var(--mute); } ul.src b { color: var(--fg); font-weight: 500; }
.banner { border: 1px solid var(--warn); color: var(--warn); padding: 12px 16px; margin-top: 18px; font-size: 13px; }
.err { border: 1px solid var(--down); color: var(--down); padding: 16px; margin-top: 24px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.sortbar { display: none; }
@media (max-width: 860px) {
  table, tbody { display: block; width: 100%; }
  thead { display: none; }
  tr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; padding-block: 14px; border-bottom: 1px solid var(--line); }
  td { display: block; border: 0; padding: 0; text-align: left; min-width: 0; overflow-wrap: anywhere; }
  td::before { content: attr(data-label); display: block; color: var(--mute); font-size: 11px; line-height: 1.3; }
  td:first-child { grid-column: 1 / -1; font-size: 14px; }
  td:first-child::before { display: none; }
  td[colspan] { grid-column: 1 / -1; }
  td.full { grid-column: 1 / -1; }
  .sortbar { display: flex; gap: 8px; align-items: center; margin: 0 0 6px; color: var(--mute); font-size: 12px; }
  .sortbar select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 6px 8px; border-radius: 0; }
}
@media (max-width: 720px) {
  .two { grid-template-columns: 1fr; gap: 0; }
  .comp { grid-template-columns: 1fr 34px; } .comp .track { grid-column: 1 / -1; grid-row: 2; }
  .note { grid-template-columns: 1fr; gap: 2px; }
  .score .big { font-size: 52px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Piyasa</h1>
    <div class="meta"><span>Kapanış <b id="refDate">–</b></span><span>Güncelleme <b id="gen">–</b></span><span>Veri kalitesi <b id="dq">–</b></span></div>
  </header>
  <nav id="nav">
    <a href="#genel" data-t="genel">Genel</a>
    <a href="#genislik" data-t="genislik">Genişlik</a>
    <a href="#sektor" data-t="sektor">Sektörler</a>
    <a href="#ai" data-t="ai">Yapay Zeka</a>
    <a href="#kaynak" data-t="kaynak">Kaynaklar</a>
  </nav>
  <div id="banner"></div>
  <main id="app"></main>
</div>
<script>
(function () {
  var MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
  function fmtDate(d) { if (!d) return "–"; var a = d.split("-"); return parseInt(a[2], 10) + " " + MONTHS[parseInt(a[1], 10) - 1] + " " + a[0]; }
  function num(v, dec) { return v === null || v === undefined ? "–" : Number(v).toLocaleString("tr-TR", { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  function sgn(v) { return v > 0 ? "+" : v < 0 ? "−" : ""; }
  function pc(v, dec) { return v === null || v === undefined ? "–" : sgn(v) + num(Math.abs(v), dec === undefined ? 2 : dec) + "%"; }
  function pt(v, dec) { return v === null || v === undefined ? "–" : sgn(v) + num(Math.abs(v), dec === undefined ? 1 : dec) + " puan"; }
  function cls(v, risk) { if (v === null || v === undefined || v === 0) return "neu"; if (risk) return v > 0 ? "rsk" : "pos"; return v > 0 ? "pos" : "neg"; }
  function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function spark(vals) {
    vals = (vals || []).filter(function (x) { return x !== null; });
    if (vals.length < 2) return "";
    var W = 84, H = 22, p = 2, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), r = (mx - mn) || 1;
    var pts = vals.map(function (y, i) { return (p + i * (W - 2 * p) / (vals.length - 1)).toFixed(1) + "," + (H - p - (y - mn) / r * (H - 2 * p)).toFixed(1); }).join(" ");
    var up = vals[vals.length - 1] >= vals[0];
    return '<svg class="sp" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + (up ? "var(--up)" : "var(--down)") + '" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  }
  function h2(t) { return '<h2>' + t + '</h2>'; }
  function sub(t) { return '<p class="sub">' + t + '</p>'; }
  function stat(k, v, d, c) { return '<div class="stat"><div class="k">' + k + '</div><div class="v ' + (c || "") + '">' + v + '</div><div class="d">' + (d || "") + '</div></div>'; }
  function ma(flag, dist) {
    if (flag === null || flag === undefined) return '<span class="neu">–</span>';
    return '<span class="' + (flag ? "pos" : "neg") + '">' + (flag ? "üstünde" : "altında") + '</span><small>' + pc(dist, 1) + '</small>';
  }
  function vtext(m) {
    var v = m && m.verify; if (!v) return "";
    if (v.status === "ok") return '<span class="dot ok"></span>';
    if (v.status === "warn") return '<span class="dot warn"></span>';
    return "";
  }

  function regime(rg) {
    if (!rg) return "";
    var col = rg.label === "RISK_ON" ? "pos" : rg.label === "RISK_OFF" ? "neg" : "rsk";
    var bars = rg.components.map(function (c) {
      return '<div class="comp"><div class="n">' + esc(c.name) + '<small>' + esc(c.note) + '</small></div><div class="track"><i style="width:' + c.score + '%"></i></div><div class="neu" style="text-align:right">' + num(c.score, 0) + '</div></div>';
    }).join("");
    return h2("Makro rejim") +
      '<div class="score"><span class="big">' + num(rg.score, 0) + '</span><span class="lab ' + col + '">' + esc(rg.label.replace("_", " ")) + '</span></div>' +
      '<div style="margin-top:14px">' + bars + '</div>' + sub("Kural tabanlı skor: bileşenlerin eşit ağırlıklı ortalaması. 65 ve üstü RISK ON, 40 altı RISK OFF.");
  }

  function levels(d) {
    var rows = "";
    Object.keys(d.indexes).forEach(function (k) {
      var m = d.indexes[k], risk = k === "VIX";
      rows += '<tr><td><b>' + k + '</b>' + vtext(m) + '<small>' + esc(m.name) + '</small></td><td>' + num(m.close, 2) + '</td><td class="' + cls(m.d1, risk) + '">' + pc(m.d1) + '</td><td class="' + cls(m.d5, risk) + '">' + pc(m.d5) + '</td><td class="' + cls(m.d20, risk) + '">' + pc(m.d20) + '</td><td class="' + cls(m.from_high) + '">' + pc(m.from_high, 1) + '</td><td>' + spark(m.spark) + '</td></tr>';
    });
    var y = d.yields;
    if (y && y.available) {
      [["y2", "US2Y", "ABD 2 yıllık", 1], ["y10", "US10Y", "ABD 10 yıllık", 1], ["spread", "10Y−2Y", "Eğri farkı", 0]].forEach(function (t) {
        var s = y[t[0]], bp = function (v) { return v === null ? "–" : sgn(v) + num(Math.abs(v), 0) + " bp"; };
        rows += '<tr><td><b>' + t[1] + '</b><small>' + t[2] + '</small></td><td>' + (t[3] ? num(s.value, 2) + "%" : sgn(s.value) + num(Math.abs(s.value), 2)) + '</td><td class="neu">' + bp(s.d1_bp) + '</td><td class="neu">' + bp(s.d5_bp) + '</td><td class="neu">–</td><td class="neu">–</td><td>' + spark(s.spark) + '</td></tr>';
      });
    }
    return h2("Seviyeler") + '<div class="tw"><table><thead><tr><th>Gösterge</th><th>Son</th><th>1G</th><th>5G</th><th>20G</th><th>Zirveye uzaklık</th><th>30 gün</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      sub("Noktalı satırlar FRED (resmi) ile doğrulandı. Değişimler işlem günü bazındadır. Petrol, Altın ve Gümüş ön ay vadeli sözleşme fiyatıdır; sözleşme yenilendiğinde (roll) fiyatta küçük süreksizlik olabilir. Zirveye uzaklık son 252 işlem gününün en yüksek kapanışına göredir.").replace('<p class="sub">', '<p class="fine">');
  }

  function trend(d) {
    var rows = [];
    ["SPX", "NASDAQ", "RUT", "WTI", "BRENT"].forEach(function (k) { if (d.indexes[k]) rows.push([k, d.indexes[k]]); });
    ["SPY", "QQQ", "IWM", "RSP", "QQQE"].forEach(function (k) { if (d.etfs[k]) rows.push([k, d.etfs[k]]); });
    var body = rows.map(function (x) {
      var m = x[1], tc = m.trend === "Yükseliş" ? "pos" : m.trend === "Düşüş" ? "neg" : "rsk";
      return '<tr><td><b>' + x[0] + '</b></td><td class="' + tc + '">' + esc(m.trend) + '</td><td>' + ma(m.above20, m.dist20) + '</td><td>' + ma(m.above50, m.dist50) + '</td><td>' + ma(m.above200, m.dist200) + '</td>' +
        '<td class="' + cls(m.from_high) + '">' + pc(m.from_high, 1) + '</td><td>' + (m.vol_vs20 === null ? '<span class="neu">–</span>' : '<span class="' + (m.vol_vs20 >= 30 ? "rsk" : "") + '">' + pc(m.vol_vs20, 0) + '</span>') + '</td><td>' + (m.vol_vs50 === null ? '<span class="neu">–</span>' : pc(m.vol_vs50, 0)) + '</td></tr>';
    }).join("");
    return h2("Trend ve hacim") + '<div class="tw"><table><thead><tr><th>Sembol</th><th>Trend</th><th>SMA 20</th><th>SMA 50</th><th>SMA 200</th><th>Zirveye uzaklık</th><th>Hacim / 20G</th><th>Hacim / 50G</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="fine">Trend: kapanış &gt; SMA50 &gt; SMA200 yükseliş, tersi düşüş, diğerleri yatay. Hacim, son günün önceki 20 ve 50 günün ortalamasına farkıdır. Endeks ve vadeli sözleşme hacimleri Yahoo verisinde güvenilir olmadığı için yalnızca ETF satırlarında gösterilir.</p>';
  }

  function notes(n) {
    if (!n || !n.length) return "";
    return h2("Risk notları") + n.map(function (x) {
      var c = { ok: "ok", warn: "warn", bad: "bad" }[x.level] || "";
      return '<div class="note"><b><span class="dot ' + c + '"></span>' + esc(x.title) + '</b><span>' + esc(x.text) + '</span></div>';
    }).join("") + '<p class="fine">Eşikler yaygın okuma kurallarıdır. Yatırım tavsiyesi değildir.</p>';
  }

  function breadth(b) {
    if (!b || !b.ma50) return h2("Piyasa genişliği") + sub("Hisse listesi alınamadığı için hesaplanmadı.");
    var s = [20, 50, 200].map(function (n) {
      var m = b["ma" + n]; if (!m) return "";
      return stat(n + " günlük ortalama üstü", "%" + num(m.pct, 1), m.above + " / " + m.total + " hisse · 1G " + pt(m.d1) + " · 5G " + pt(m.d5));
    }).join("") + stat("52 hafta", '<span class="pos">' + num(b.new_highs, 0) + '</span> <span class="mute">/</span> <span class="neg">' + num(b.new_lows, 0) + '</span>', "yeni zirve / yeni dip");
    return h2("Piyasa genişliği") + sub("S&P 500 hisselerinin kaçı ortalamalarının üstünde. " + fmtDate(b.date)) + '<div class="stats">' + s + '</div>';
  }

  function pairs(p) {
    var rows = p.map(function (x) {
      if (!x.available) return '<tr><td><b>' + x.a + ' / ' + x.b + '</b></td><td colspan="5" class="neu">Veri alınamadı</td></tr>';
      var vc = x.verdict === "GENİŞ" ? "pos" : x.verdict === "DAR" ? "rsk" : "neu";
      return '<tr><td><b>' + x.a + ' / ' + x.b + '</b><small>' + esc(x.label) + '</small></td><td class="' + cls(x.ret20_a) + '">' + pc(x.ret20_a) + '</td><td class="' + cls(x.ret20_b) + '">' + pc(x.ret20_b) + '</td><td class="' + cls(x.ret20_diff) + '">' + pt(x.ret20_diff, 2) + '</td><td>' + spark(x.spark) + '</td><td class="' + vc + '"><b>' + x.verdict + '</b></td></tr>';
    }).join("");
    return h2("Dar mı geniş mi") + '<div class="tw"><table><thead><tr><th>Çift</th><th>Eşit ağırlık 20G</th><th>Ağırlıklı 20G</th><th>Fark</th><th>Oran 60 gün</th><th>Karar</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="fine">Eşit ağırlıklı ETF 20 günde 1 puan veya daha fazla geride ise yükseliş DAR (az sayıda büyük hisse taşıyor), 1 puan veya fazla öndeyse GENİŞ.</p>';
  }

  function sectors(rows) {
    if (!rows || !rows.length) return "";
    var body = rows.map(function (s) {
      var sc = { "Lider": "pos", "Toparlanıyor": "neu", "Zayıflıyor": "rsk", "Geride": "neg" }[s.status] || "";
      var tc = s.trend === "Yükseliş" ? "pos" : s.trend === "Düşüş" ? "neg" : "rsk";
      return '<tr><td><b>' + s.symbol + '</b> <span class="mute">' + esc(s.name) + '</span></td><td class="' + sc + '">' + esc(s.status) + '</td><td class="' + cls(s.rel20) + '">' + pt(s.rel20, 2) + '</td><td class="' + cls(s.d1) + '">' + pc(s.d1) + '</td><td class="' + cls(s.d5) + '">' + pc(s.d5) + '</td><td class="' + cls(s.d20) + '">' + pc(s.d20) + '</td>' +
        '<td class="' + cls(s.from_high) + '">' + pc(s.from_high, 1) + '</td><td class="' + tc + '">' + esc(s.trend || "–") + '</td><td>' + ma(s.above20, s.dist20) + '</td><td>' + ma(s.above50, s.dist50) + '</td><td>' + ma(s.above200, s.dist200) + '</td>' +
        '<td>' + (s.vol_vs20 === null || s.vol_vs20 === undefined ? "–" : pc(s.vol_vs20, 0)) + '</td><td>' + spark(s.spark) + '</td></tr>';
    }).join("");
    return h2("Sektör liderliği") + '<div class="tw"><table><thead><tr><th>Sektör</th><th>Durum</th><th>SPY\'a göre 20G</th><th>1G</th><th>5G</th><th>20G</th><th>Zirveye uzaklık</th><th>Trend</th><th>SMA 20</th><th>SMA 50</th><th>SMA 200</th><th>Hacim / 20G</th><th>30 gün</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="fine">Lider: SPY\'dan güçlü ve SMA50 üstünde. Toparlanıyor: güçlü ama altında. Zayıflıyor: zayıf ama üstünde. Geride: ikisi de zayıf. Zirveye uzaklık son 252 işlem gününün en yüksek kapanışına göredir.</p>';
  }

  var AI_SORT = { k: "d20", dir: -1 };
  function aiTable(a) {
    var cols = [["symbol", "Hisse"], ["d1", "1G"], ["d5", "5G"], ["d20", "20G"], ["rel20", "SPY'a göre 20G"], ["above50", "SMA 50"], ["above200", "SMA 200"], ["from_high", "Zirveye uzaklık"], ["vol_vs20", "Hacim / 20G"]];
    var rows = a.stocks.slice().sort(function (x, y) {
      var k = AI_SORT.k, u = x[k], v = y[k];
      if (typeof u === "boolean") { u = u ? 1 : 0; v = v ? 1 : 0; }
      if (u === null || u === undefined) return 1; if (v === null || v === undefined) return -1;
      if (typeof u === "string") return u.localeCompare(v) * AI_SORT.dir;
      return (u - v) * AI_SORT.dir;
    });
    var head = cols.map(function (c) { return '<th class="s" data-k="' + c[0] + '">' + c[1] + (AI_SORT.k === c[0] ? (AI_SORT.dir > 0 ? " ↑" : " ↓") : "") + '</th>'; }).join("");
    function ab(f) { return f === null || f === undefined ? "–" : '<span class="' + (f ? "pos" : "neg") + '">' + (f ? "üstünde" : "altında") + '</span>'; }
    var body = rows.map(function (s) {
      return '<tr><td><b>' + esc(s.symbol) + '</b> <span class="mute">' + esc(s.name) + '</span></td><td class="' + cls(s.d1) + '">' + pc(s.d1) + '</td><td class="' + cls(s.d5) + '">' + pc(s.d5) + '</td><td class="' + cls(s.d20) + '">' + pc(s.d20) + '</td><td class="' + cls(s.rel20) + '">' + pt(s.rel20, 1) + '</td><td>' + ab(s.above50) + '</td><td>' + ab(s.above200) + '</td><td class="' + cls(s.from_high) + '">' + pc(s.from_high, 1) + '</td><td>' + (s.vol_vs20 === null ? "–" : pc(s.vol_vs20, 0)) + '</td></tr>';
    }).join("");
    var opts = cols.map(function (c) { return '<option value="' + c[0] + '"' + (AI_SORT.k === c[0] ? " selected" : "") + '>' + c[1] + '</option>'; }).join("");
    return '<div class="sortbar"><label for="aisort">Sırala</label><select id="aisort">' + opts + '</select></div><div class="tw"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }
  function aiMini(list) {
    return '<div class="tw"><table><tbody>' + list.map(function (s) {
      return '<tr><td><b>' + esc(s.symbol) + '</b><small>' + esc(s.name) + '</small></td><td data-label="20G" class="' + cls(s.d20) + '">' + pc(s.d20) + '</td><td data-label="1G" class="' + cls(s.d1) + '">' + pc(s.d1) + '</td></tr>';
    }).join("") + '</tbody></table></div>';
  }
  function aiDetail(a) {
    var names = { SOXX: "SOXX · iShares", SMH: "SMH · VanEck", DRAM: "DRAM · Roundhill" };
    var rows = ["SOXX", "SMH", "DRAM"].map(function (k) {
      var d = a.detail && a.detail[k]; if (!d) return "";
      var vc = d.verdict === "GENİŞ" ? "pos" : d.verdict === "DAR" ? "rsk" : "neu";
      var top = d.top.map(function (t) { return esc(t.symbol); }).join(" · ");
      return '<tr><td><b>' + names[k] + '</b><small>liste: ' + fmtDate(d.asof) + ' · ' + d.covered + '/' + d.listed + ' hisse, ağırlığın %' + num(d.covered_weight, 0) + '\'i</small></td>' +
        '<td class="' + cls(d.w_d1) + '">' + pc(d.w_d1) + '</td><td class="' + cls(d.w_d5) + '">' + pc(d.w_d5) + '</td><td class="' + cls(d.w_d20) + '">' + pc(d.w_d20) + '</td><td class="' + cls(d.eq_d20) + '">' + pc(d.eq_d20) + '</td>' +
        '<td>%' + num(d.above50_w, 0) + '<small>sayı: %' + num(d.above50_n, 0) + '</small></td><td>%' + num(d.above200_w, 0) + '<small>sayı: %' + num(d.above200_n, 0) + '</small></td><td class="' + vc + '"><b>' + (d.verdict || "–") + '</b></td><td class="mute">' + top + '</td></tr>';
    }).join("");
    return h2("ETF içi görünüm (ağırlıklı)") + '<div class="tw"><table><thead><tr><th>ETF</th><th>Ağırlıklı 1G</th><th>Ağırlıklı 5G</th><th>Ağırlıklı 20G</th><th>Eşit ağırlıklı 20G</th><th>SMA 50 üstü (ağırlık)</th><th>SMA 200 üstü (ağırlık)</th><th>Yapı</th><th>En büyük 5 hisse</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="fine">Ağırlıklı değerler fonun gerçek pozisyon ağırlıklarıyla, eşit ağırlıklı değer her hissenin aynı payla hesaplanır. Eşit ağırlıklı 20G, ETF\'in kendi 20G getirisinin 1 puan veya fazla gerisindeyse yapı DAR (birkaç dev pozisyon taşıyor), önündeyse GENİŞ. DRAM\'de aynı hisseye hem doğrudan hem swap ile verilen pozisyonlar toplandı; ağırlıklar fon varlığının yüzdesidir ve nakit/tahvil kalemleri dahil değildir. Fonun %5,01\'lik CXMT pozisyonu borsada işlem görmediği için hesaba katılmaz.</p>';
  }
  function ai(a) {
    if (!a || !a.etfs) return h2("Yapay zeka") + sub("Bu bölüm bu güncellemede hesaplanamadı. Bir sonraki çalışmada yeniden denenir.");
    var e = a.etfs.map(function (m) {
      if (!m.available) return '<tr><td><b>' + m.symbol + '</b><small>' + esc(m.name) + '</small></td><td colspan="10" class="neu">Veri alınamadı</td></tr>';
      return '<tr><td><b>' + m.symbol + '</b><small>' + esc(m.name) + '</small></td><td>' + num(m.close, 2) + '</td><td class="' + cls(m.d1) + '">' + pc(m.d1) + '</td><td class="' + cls(m.d5) + '">' + pc(m.d5) + '</td><td class="' + cls(m.d20) + '">' + pc(m.d20) + '</td><td class="' + cls(m.d60) + '">' + pc(m.d60) + '</td>' +
        '<td class="' + cls(m.rel.spy[20]) + '">' + pt(m.rel.spy[20], 1) + '</td><td class="' + cls(m.rel.qqq[20]) + '">' + pt(m.rel.qqq[20], 1) + '</td><td>' + ma(m.above50, m.dist50) + '</td><td>' + ma(m.above200, m.dist200) + '</td><td>' + spark(m.spark) + '</td></tr>';
    }).join("");
    var out = h2("Yapay zeka ve yarı iletken ETF'leri") +
      '<div class="tw"><table><thead><tr><th>ETF</th><th>Son</th><th>1G</th><th>5G</th><th>20G</th><th>60G</th><th>SPY\'a göre 20G</th><th>QQQ\'ya göre 20G</th><th>SMA 50</th><th>SMA 200</th><th>30 gün</th></tr></thead><tbody>' + e + '</tbody></table></div>';
    if (!a.available) return out + sub("Bileşen verisi yetersiz: " + esc(a.error || ""));
    var b = a.breadth;
    out += aiDetail(a) + h2("Genişlik (tüm bileşenler birlikte)") + '<div class="stats">' +
      stat("SMA 50 üstü", "%" + num(b.above50, 1), a.count + " benzersiz hisse") +
      stat("SMA 200 üstü", "%" + num(b.above200, 1), "uzun vade") +
      stat("20 günde pozitif", "%" + num(b.positive_d20, 1), "hisse payı") +
      stat("Zirveye %5 yakın", "%" + num(b.near_high, 1), "52 hafta") +
      stat("Bellek hisseleri 20G", pc(a.memory.avg_d20), a.memory.count + " hisse (DRAM'in bileşenleri)", cls(a.memory.avg_d20)) + '</div>' +
      '<div class="two"><div>' + h2("20 günlük liderler") + aiMini(a.leaders) + '</div><div>' + h2("20 günlük gerideler") + aiMini(a.laggards) + '</div></div>' +
      h2("Tüm bileşenler") + aiTable(a);
    var asof = Object.keys(a.detail || {}).map(function (k) { return k + " " + fmtDate(a.detail[k].asof); }).join(", ");
    var old = Object.keys(a.detail || {}).some(function (k) { return (Date.now() - new Date(a.detail[k].asof).getTime()) / 864e5 > 120; });
    out += '<p class="fine">Bileşen listeleri fonların resmi dosyalarından alınmıştır (' + esc(asof) + '). Fiyatlar her gece güncellenir; liste ağırlıkları fon yeniden dengelendikçe değişir.' + (old ? ' <span class="rsk">Liste 120 günden eski, ağırlıklar güncel olmayabilir.</span>' : '') + ' Kore, Tayvan, Japonya ve Çin borsasındaki hisselerin fiyatları kendi para birimi ve kendi işlem saatlerindedir; yüzde değişimleri karşılaştırılabilir.</p>';
    return out;
  }

  function sources(meta) {
    var li = meta.sources.map(function (s) { return '<li><b>' + esc(s.name) + '</b> · ' + esc(s.use) + ' · ' + (s.official ? "resmi" : "resmi değil") + '</li>'; }).join("");
    var cov = meta.coverage ? '<li><b>Kapsam</b> · ' + meta.coverage.received + ' / ' + meta.coverage.requested + ' hisse' + (meta.coverage.late ? ', ' + meta.coverage.late + ' hissenin son günü eksik' : '') + '</li>' : "";
    var ver = (meta.verification || []).map(function (v) {
      var st = { ok: "uyumlu", warn: "küçük fark", unavailable: "doğrulanamadı", bad: "uyuşmazlık" }[v.status] || v.status;
      var det = v.date ? ' · ' + fmtDate(v.date) + ' · ' + num(v.yahoo, 2) + ' ↔ ' + num(v.official, 2) : (v.note ? ' · ' + esc(v.note) : '');
      return '<li><b>' + v.id + '</b> ↔ FRED ' + v.fred + ' · ' + st + det + '</li>';
    }).join("");
    var reasons = meta.quality && meta.quality.reasons && meta.quality.reasons.length ? '<li><b>Kalite notları</b> · ' + meta.quality.reasons.map(esc).join("; ") + '</li>' : "";
    var warns = meta.warnings && meta.warnings.length ? '<li><b>Uyarılar</b> · ' + meta.warnings.map(esc).join("; ") + '</li>' : "";
    return h2("Kaynaklar ve doğrulama") + '<ul class="src">' + li + cov + ver + reasons + warns + '</ul>' +
      '<p class="fine">Sistem her iş günü ABD kapanışından sonra kendiliğinden çalışır, çekilen veriyi resmi kaynaklarla karşılaştırır, tutarsızsa yayını durdurup önceki doğrulanmış sayfayı korur ve yeniden dener. Alınamayan veri tahmin edilmez.</p>';
  }

  var DATA = null;
  function tabs(d) {
    return '<section class="tab" id="t-genel">' + regime(d.regime) + levels(d) + trend(d) + notes(d.notes) + '</section>' +
      '<section class="tab" id="t-genislik">' + breadth(d.breadth) + pairs(d.pairs) + '</section>' +
      '<section class="tab" id="t-sektor">' + sectors(d.sectors) + '</section>' +
      '<section class="tab" id="t-ai">' + ai(d.ai) + '</section>' +
      '<section class="tab" id="t-kaynak">' + sources(d.meta) + '</section>';
  }
  function show() {
    var h = (location.hash || "#genel").slice(1);
    if (!document.getElementById("t-" + h)) h = "genel";
    Array.prototype.forEach.call(document.querySelectorAll("section.tab"), function (s) { s.classList.toggle("on", s.id === "t-" + h); });
    Array.prototype.forEach.call(document.querySelectorAll("nav a"), function (a) { a.classList.toggle("on", a.getAttribute("data-t") === h); });
  }
  function labels() {
    Array.prototype.forEach.call(document.querySelectorAll("#app table"), function (t) {
      var hs = Array.prototype.map.call(t.querySelectorAll("thead th"), function (h) { return h.textContent.replace(/[↑↓]/g, "").trim(); });
      if (!hs.length) return;
      Array.prototype.forEach.call(t.querySelectorAll("tbody tr"), function (tr) {
        Array.prototype.forEach.call(tr.children, function (td, i) { if (!td.hasAttribute("data-label") && hs[i]) td.setAttribute("data-label", hs[i]); });
      });
    });
  }
  function draw() { document.getElementById("app").innerHTML = tabs(DATA); labels(); show(); }

  function render(d) {
    DATA = d;
    var q = d.meta.quality || {}, el = document.getElementById("dq");
    el.textContent = q.level || "–";
    el.className = q.level === "YÜKSEK" ? "pos" : q.level === "DÜŞÜK" ? "neg" : "rsk";
    var ageH = (Date.now() - new Date(d.meta.generated_at).getTime()) / 36e5;
    document.getElementById("banner").innerHTML = ageH > 96 ? '<div class="banner">Bu veri ' + Math.floor(ageH / 24) + ' günden eski. Otomatik güncelleme beklenenden uzun süredir yayın yapamadı; son doğrulanmış veri gösteriliyor.</div>' : "";
    document.getElementById("refDate").textContent = fmtDate(d.meta.ref_date);
    document.getElementById("gen").textContent = new Date(d.meta.generated_at).toLocaleString("tr-TR", { timeZone: "Europe/Istanbul", dateStyle: "medium", timeStyle: "short" });
    draw();
  }
  document.addEventListener("click", function (e) {
    var th = e.target.closest && e.target.closest("th.s");
    if (!th || !DATA) return;
    var k = th.getAttribute("data-k");
    AI_SORT = { k: k, dir: AI_SORT.k === k ? -AI_SORT.dir : (k === "symbol" ? 1 : -1) };
    draw();
  });
  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "aisort" && DATA) {
      var k = e.target.value;
      AI_SORT = { k: k, dir: k === "symbol" ? 1 : -1 };
      draw();
    }
  });
  window.addEventListener("hashchange", show);
  fetch("data.json?v=" + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(render).catch(function (e) {
    document.getElementById("app").innerHTML = '<div class="err">Veri yüklenemedi (' + esc(e.message) + '). Birkaç dakika sonra yenile.</div>';
  });
})();
</script>
</body>
</html>
