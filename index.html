:root {
  --bg: #fbfbf9; --fg: #1a1a18; --mute: #6b6b65; --line: #e7e6e1; --soft: #f3f2ee;
  --up: #2f7d57; --down: #b4483f; --warn: #8a6212; --ink: #1a1a18;
  --pxu: #1f6a45; --pxu-bg: #e1f0e8; --pxd: #a23a32; --pxd-bg: #f8e3e0; --pxn: #6b6b65; --pxn-bg: #eeede8;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111110; --fg: #ecebe6; --mute: #8c8c86; --line: #262624; --soft: #1a1a18;
    --up: #6fbf95; --down: #e08278; --warn: #d4a94f; --ink: #ecebe6; --pxu: #7fd1a4; --pxu-bg: #173326; --pxd: #f0948a; --pxd-bg: #3a1d1a; --pxn: #a5a59f; --pxn-bg: #242422; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111110; --fg: #ecebe6; --mute: #8c8c86; --line: #262624; --soft: #1a1a18;
  --up: #6fbf95; --down: #e08278; --warn: #d4a94f; --ink: #ecebe6; --pxu: #7fd1a4; --pxu-bg: #173326; --pxd: #f0948a; --pxd-bg: #3a1d1a; --pxn: #a5a59f; --pxn-bg: #242422; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--fg); font: 400 14px/1.55 var(--font); padding-inline: 20px; padding-block: 0 80px; font-variant-numeric: tabular-nums; }
.wrap { max-width: 980px; margin-inline: auto; }
.meta { color: var(--mute); font-size: 11px; letter-spacing: .02em; display: flex; justify-content: center; gap: 2px 14px; flex-wrap: wrap; margin-top: 40px; padding-top: 16px; padding-bottom: 8px; border-top: 1px solid var(--line); opacity: .8; font-variant-numeric: tabular-nums; }
.meta b { font-weight: 400; }
.meta { display: none; } body.tg .meta { display: flex; }
nav { display: flex; gap: 6px; position: sticky; top: 0; z-index: 5; margin-inline: -20px; padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 12px; overflow-x: auto; scrollbar-width: none; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
nav::-webkit-scrollbar { display: none; }
nav a { flex: none; color: var(--mute); text-decoration: none; padding: 7px 14px; font-size: 13px; font-weight: 500; letter-spacing: .01em; border-radius: 999px; transition: color .15s, background .15s; }
nav a:hover { color: var(--fg); }
nav a.on { color: var(--bg); background: var(--ink); }
nav a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
section.tab > h2:first-child { margin-top: 30px; }
@media (hover: hover) and (min-width: 861px) { tbody tr:hover td { background: var(--soft); } }
section.tab { display: none; }
section.tab.on { display: block; }
h2 { font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 44px 0 6px; }
.sub { color: var(--mute); font-size: 12px; margin: 0 0 14px; max-width: 70ch; }
.pos { color: var(--up); } .neg { color: var(--down); } .rsk { color: var(--warn); } .neu { color: var(--mute); }
.mute { color: var(--mute); }
.tw { overflow: visible; }
table { width: 100%; border-collapse: collapse; table-layout: auto; }
th { font-weight: 400; font-size: 11px; color: var(--mute); text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: right; font-size: 13px; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td small { display: block; color: var(--mute); font-size: 11px; }
td b { font-weight: 500; }
th.s { cursor: pointer; } th.s:hover { color: var(--fg); } th.s:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
details.srcbox { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
details.srcbox summary { cursor: pointer; color: var(--mute); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.part { margin: 14px 0 22px; }
.partk { color: var(--mute); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--warn); letter-spacing: .06em; }
.partv { font-size: 40px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.partd { font-size: 13px; color: var(--mute); font-weight: 400; letter-spacing: 0; }
.partsvg { width: 100%; height: 110px; display: block; margin-top: 8px; }
.partline { fill: none; stroke: var(--up); stroke-width: 2; }
.partarea { fill: var(--up); opacity: .12; stroke: none; }
.partax { display: flex; justify-content: space-between; color: var(--mute); font-size: 11px; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 28px 24px; margin: 14px 0 6px; }
.stat .k { color: var(--mute); font-size: 12px; }
.stat .v { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.25; }
.stat .d { color: var(--mute); font-size: 12px; }
.rgc { border: 1px solid var(--line); border-radius: 16px; padding: 20px 20px 18px; margin: 10px 0 18px; }
.rgp { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; letter-spacing: .1em; }
.rgp.pos { color: var(--pxu); background: var(--pxu-bg); } .rgp.neg { color: var(--pxd); background: var(--pxd-bg); } .rgp.neu { color: var(--pxn); background: var(--pxn-bg); }
.rgm { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.rgm .big { font-size: 56px; font-weight: 500; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.rgs { color: var(--mute); font-size: 13px; }
.rgst { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; border-top: 1px solid var(--line); }
.rgst > div { padding-top: 14px; min-width: 0; } .rgst > div + div { padding-left: 14px; border-left: 1px solid var(--line); }
.rgst small { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.rgst b { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.rgbar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; } .rgbar i { display: block; height: 100%; background: var(--up); }
.note { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding-block: 11px; border-bottom: 1px solid var(--line); }
.note b { font-weight: 500; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; background: var(--mute); vertical-align: 1px; }
.dot.ok { display: none; } .dot.warn { background: var(--warn); } .dot.bad { background: var(--down); }
.fine { color: var(--mute); font-size: 12px; margin: 12px 0 0; max-width: 78ch; }
ul.src { list-style: none; padding: 0; margin: 0; } ul.src li { padding-block: 9px; border-bottom: 1px solid var(--line); color: var(--mute); } ul.src b { color: var(--fg); font-weight: 500; }
.banner { border: 1px solid var(--warn); color: var(--warn); padding: 12px 16px; margin-top: 18px; font-size: 13px; }
.err { border: 1px solid var(--down); color: var(--down); padding: 16px; margin-top: 24px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.px { display: inline-block; margin-left: 6px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 1.5; white-space: nowrap; letter-spacing: .01em; vertical-align: 1px; }
.px.up { color: var(--pxu); background: var(--pxu-bg); } .px.up::before { content: "▲ "; font-size: 9px; vertical-align: 1px; }
.px.dn { color: var(--pxd); background: var(--pxd-bg); } .px.dn::before { content: "▼ "; font-size: 9px; vertical-align: 1px; }
.px.nu { color: var(--pxn); background: var(--pxn-bg); }
.sa { display: inline-block; margin-left: 6px; padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; line-height: 1.5; color: var(--mute); text-decoration: none; vertical-align: 1px; }
.sa:hover, .sa:focus-visible { color: var(--fg); border-color: var(--mute); }
.lk { white-space: nowrap; }
.eb { margin-left: 8px; font-size: 11px; color: var(--mute); white-space: nowrap; }
.eb::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; opacity: .8; }
.eb.soon { color: var(--warn); font-weight: 600; }
details.chg { margin: 30px 0 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
details.chg + h2 { margin-top: 28px; }
details.chg > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; }
details.chg > summary::-webkit-details-marker { display: none; }
.cd { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
.ct { font-weight: 600; }
.csum { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; justify-content: flex-end; }
