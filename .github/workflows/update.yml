name: Piyasa verisini güncelle

on:
  schedule:
    # ABD: hisse kapanışı 16:00 ET, Cboe VIX ve SPX endeks kapanışı 16:15 ET (resmi). Güncelleme 16:30 ET'den sonra başlar; GitHub yoğun dakikalarda (:00, :30) daha çok geciktirdiği için 16:33 ET seçildi.
    # 16:33 ET = 20:33 UTC (yaz) / 21:33 UTC (kış). İki zamanlama var, "Kapanış kontrolü" işi hangisinin çalışacağını seçer, diğeri atlanır.
    - cron: "33 20 * * 1-5"
    - cron: "33 21 * * 1-5"
    # Yedek: ilk çalışma başarısız olursa 01:30 UTC'de tekrar dener (bugünün verisi yayındaysa atlanır)
    - cron: "30 1 * * 2-6"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Kapanış kontrolü
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            ny=$(TZ=America/New_York date +%H%M)
            today=$(TZ=America/New_York date +%F)
            if [ "$((10#$ny))" -lt 1630 ]; then run=false; echo "New York $ny: kapanış verisi henüz hazır değil, atlandı"; fi
            live=$(curl -fsS --max-time 30 "https://mbay9.github.io/piyasa-paneli/data.json?t=$RANDOM" | jq -r '.meta.ref_date' || true)
            if [ "$live" = "$today" ]; then run=false; echo "Bugünün verisi zaten yayında ($live), atlandı"; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rejim kuralı testleri
        run: python test_regime.py
      - name: Veriyi üret (başarısızsa 3 kez dener)
        run: |
          for i in 1 2 3; do
            if timeout 1200 python update.py; then ok=1; break; fi
            echo "Deneme $i başarısız, 8 dakika sonra tekrar"; sleep 480
          done
          test "$ok" = 1
      - name: Veriyi denetle
        run: python validate.py
      - run: |
          mkdir site
          cp index.html app.js data.json site/
          [ -f ozet.json ] && cp ozet.json site/ || true
          # tarayıcı önbelleği eski app.js'i tutmasın diye her yayında sürüm eki
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_RUN_ID}\"|" site/index.html
          grep -q "app.js?v=" site/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  keepalive:
    # GitHub, 60 gün hareketsiz public depolarda zamanlanmış çalışmaları kapatır; 45 günde bir boş commit atılır
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Zamanlamayı canlı tut"
            git push
          fi
