name: Bilanço bültenleri

# Bilanço açıklayan şirketlerin basın bültenini (8-K, ek 99.1) SEC EDGAR'dan indirir ve `bildirim` dalına yazar.
# Rakam yorumlanmaz; metin olduğu gibi saklanır, tablo hazırlayan görev bunları okuyup doğrular.
on:
  schedule:
    - cron: "10 14 * * 1-5"   # sabah (ET 09:10 civarı): gece ve piyasa öncesi açıklananlar
    - cron: "50 21 * * 1-5"   # akşam (ET 16:50 civarı): kapanıştan hemen sonra gelenler
    - cron: "40 23 * * 1-5"   # gece (ET 18:40 civarı): geç gelenler
  push:
    branches: [main]
    paths: [tetik/bildirim.txt]
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç gün geriye bakılsın (önceki çeyrek rehberliği için 120)"
        default: "4"

permissions:
  contents: write

concurrency:
  group: bildirim
  cancel-in-progress: false

jobs:
  bildirim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python test_edgar.py
      - name: Önceki kayıtları al
        run: |
          mkdir -p /tmp/onceki
          if git fetch -q origin +bildirim:refs/remotes/origin/bildirim 2>/dev/null; then
            git archive origin/bildirim | tar -x -C /tmp/onceki
          fi
          mkdir -p bildirim && [ -d /tmp/onceki/bildirim ] && cp -r /tmp/onceki/bildirim/. bildirim/ || true
      - name: EDGAR'dan indir
        run: python edgar.py "$(python -c "import json;print(','.join(x['symbol'] for x in json.load(open('hisseler.json',encoding='utf-8'))['items']))")" "${{ github.event.inputs.gun || '4' }}"
      - name: bildirim dalına yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r bildirim /tmp/cikti
          rm -rf bildirim
          # Dal her seferinde tek commit olarak yeniden yazılır: silinen eski bültenler geçmişte de kalmaz, depo büyümez.
          if [ -d /tmp/onceki/bildirim ] && diff -rq /tmp/onceki/bildirim /tmp/cikti >/dev/null; then echo "değişiklik yok"; exit 0; fi
          git checkout -q --orphan yeni
          git rm -rqf . >/dev/null 2>&1 || true
          rm -rf bildirim && cp -r /tmp/cikti bildirim
          git add bildirim
          git commit -q -m "Bülten"
          git push -q --force origin yeni:bildirim
