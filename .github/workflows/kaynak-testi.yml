name: Kaynak testi

# Ağırlık kaynağı yoklaması. Siteyi değiştirmez.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml
      - run: python kaynak_testi.py --rapor kaynak-rapor.json
      - name: Raporu gorev dalına yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp kaynak-rapor.json /tmp/ && rm -f kaynak-rapor.json
          git fetch -q origin gorev && git checkout -q -B gorev origin/gorev || git checkout -q --orphan gorev
          cp /tmp/kaynak-rapor.json .
          git add kaynak-rapor.json && git commit -q -m "Kaynak testi" && git push -q origin gorev
