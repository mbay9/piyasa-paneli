name: Kaynak testi

# Ağırlık kaynağı yoklaması. Siteyi değiştirmez.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt lxml openpyxl pypdf
      - run: python kaynak_testi.py --rapor kaynak-rapor.json
      - name: Raporu gorev dalına yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp kaynak-rapor.json /tmp/ && rm -f kaynak-rapor.json
          git fetch -q origin gorev && git checkout -q -B gorev origin/gorev || git checkout -q --orphan gorev
          cp /tmp/kaynak-rapor.json .
          git add kaynak-rapor.json
          if git diff --cached --quiet; then echo "değişiklik yok"; else
            git commit -q -m "Kaynak testi"
            for i in 1 2 3 4; do
              git push -q origin gorev && break
              git fetch -q origin gorev && git rebase -q origin/gorev || { git rebase --abort; exit 1; }
            done
          fi
