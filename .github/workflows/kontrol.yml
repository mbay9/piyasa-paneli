name: Sağlık kontrolü

# Her kod değişikliğinde (ozet dosyaları hariç) kod, yapılandırma ve sayfa yayındaki veriyle gerçek tarayıcıda denenir.
# Zamanlanmış çalıştırmalar nöbetçidir: güncelleme ve günün özeti zamanında geldi mi bakar, gelmediyse nedeniyle birlikte kırmızıya döner
# (GitHub, başarısız çalışmayı e-posta ile bildirir). Yayını değiştirmez.
on:
  push:
    branches: [main]
    paths-ignore: [ozet.json, ozet_gecmis.json]
  schedule:
    # ABD kapanışından sonra veri ve özet yayını (yaz/kış saati farkını kapsayacak şekilde iki saat), sabah Asya eki
    - cron: "50 22,23 * * 1-5"
    - cron: "20 1,3 * * 2-6"
    - cron: "17 13,15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: kontrol
  cancel-in-progress: true

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml playwright
      - name: Kod ve yapılandırma
        run: python saglik.py onkontrol
      - name: Sayfa, yayındaki veriyle gerçek tarayıcıda
        env:
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir site
          cp index.html app.js ozet.json site/
          curl -fsS --max-time 60 "${URL}data.json?t=$RANDOM" -o site/data.json
          python saglik.py site site
      - name: Nöbetçi (güncelleme ve özet zamanında geldi mi)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python saglik.py nobetci
