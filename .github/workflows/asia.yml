name: Kapanışa göre kısmi yenileme

on:
  schedule:
    # KOSPI (KRX kapanış müzayedesi 15:20-15:30 KST) ve Nikkei 225 (TSE kapanış 15:30 JST, 5 Kasım 2024'ten beri) resmi kapanışı 15:30 yerel = 06:30 UTC.
    # Kapanıştan 15 dakika sonra, 06:45 UTC'de yalnız bu ikisi yenilenir.
    - cron: "45 6 * * 1-5"
    # BTC 7/24 işlem görür, günlük mum kapanışı UTC 00:00. Kapanıştan 15 dakika sonra, 00:15 UTC'de biten günün kapanışı yazılır (her gün).
    - cron: "15 0 * * *"
  push:
    branches: [main]
    paths: [ozet.json]
  workflow_dispatch:
    inputs:
      only:
        description: "Yenilenecek göstergeler (virgülle): KOSPI,NIKKEI veya BTC"
        default: "KOSPI,NIKKEI"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      hata: ${{ steps.uret.outputs.hata }}
      isaret: ${{ steps.iz.outputs.isaret }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sayfa dosyalarını depodan al (yalnız seçilen gösterge değişecek)
        run: |
          mkdir site
          cp index.html app.js site/
          [ -f ozet.json ] && cp ozet.json site/ || true
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_RUN_ID}\"|" site/index.html
          grep -q "app.js?v=" site/index.html
      - name: Hangi gösterge yenilenecek
        id: sel
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT: ${{ inputs.only }}
        run: |
          if [ "$SCHED" = "15 0 * * *" ]; then only=BTC; elif [ -n "$INPUT" ]; then only="$INPUT"; else only="KOSPI,NIKKEI"; fi
          case "$only" in *[!A-Z0-9,]*) echo "geçersiz"; exit 1;; esac
          echo "only=$only" >> "$GITHUB_OUTPUT"
      - name: Yalnız seçilen göstergeyi yenile
        id: uret
        run: |
          set -o pipefail
          if ! python update.py --only "${{ steps.sel.outputs.only }}" 2>&1 | tee update.log; then
            echo "hata=$( (grep -h 'HATA' update.log | tail -n 3; tail -n 2 update.log) | cut -c1-400 | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Veriyi denetle
        run: python validate.py
      - name: Yayın işareti (kayıt işi canlı sitede bunu arar)
        id: iz
        run: echo "isaret=$(jq -r '(.meta.partial_refreshed_at // "") + "|" + .meta.generated_at' data.json)" >> "$GITHUB_OUTPUT"
      - run: cp data.json site/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  kayit:
    name: Yayın kaydı (veri dalı)
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash .github/kayit.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT: ${{ needs.build.outputs.isaret }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HATA: ${{ needs.build.outputs.hata }}
