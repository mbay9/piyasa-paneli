name: Kapanışa göre kısmi yenileme

on:
  schedule:
    # KOSPI (KRX kapanış müzayedesi 15:20-15:30 KST) ve Nikkei 225 (TSE kapanış 15:30 JST, 5 Kasım 2024'ten beri) resmi kapanışı 15:30 yerel = 06:30 UTC.
    # Kapanıştan 15 dakika sonra, 06:45 UTC'de yalnız bu ikisi yenilenir.
    - cron: "45 6 * * 1-5"
    # BTC 7/24 işlem görür, günlük mum kapanışı UTC 00:00. Kapanıştan 15 dakika sonra, 00:15 UTC'de biten günün kapanışı yazılır (Sal-Cum arası).
    - cron: "15 0 * * 2-6"
  push:
    branches: [main]
    paths: [ozet.json]
  workflow_dispatch:
    inputs:
      only:
        description: "Yenilenecek göstergeler (virgülle): KOSPI,NIKKEI veya BTC"
        default: "KOSPI,NIKKEI"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sayfa dosyalarını depodan al (yalnız seçilen gösterge değişecek)
        run: |
          mkdir site
          cp index.html app.js site/
          [ -f ozet.json ] && cp ozet.json site/ || true
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_RUN_ID}\"|" site/index.html
          grep -q "app.js?v=" site/index.html
      - name: Hangi gösterge yenilenecek
        id: sel
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT: ${{ inputs.only }}
        run: |
          if [ "$SCHED" = "15 0 * * 2-6" ]; then only=BTC; elif [ -n "$INPUT" ]; then only="$INPUT"; else only="KOSPI,NIKKEI"; fi
          case "$only" in *[!A-Z0-9,]*) echo "geçersiz"; exit 1;; esac
          echo "only=$only" >> "$GITHUB_OUTPUT"
      - name: Yalnız seçilen göstergeyi yenile
        run: python update.py --only "${{ steps.sel.outputs.only }}"
      - name: Veriyi denetle
        run: python validate.py
      - run: cp data.json site/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
