name: tani
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for u in "https://stooq.com/q/d/l/?s=^spx&i=d" "https://stooq.com/q/d/l/?s=spy.us&i=d" "https://stooq.com/q/d/l/?s=^kospi&i=d" "https://stooq.com/q/d/l/?s=^nkx&i=d" "https://stooq.com/q/d/l/?s=^ndq&i=d" "https://stooq.com/q/d/l/?s=btcusd&i=d" \
                   "https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500&cosd=2026-10-20" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=NASDAQCOM&cosd=2026-10-20" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=NIKKEI225&cosd=2026-10-20" \
                   "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400&start=2026-11-04T00:00:00Z&end=2026-11-10T00:00:00Z" \
                   "https://api.nasdaq.com/api/quote/SPY/historical?assetclass=etf&fromdate=2026-11-02&todate=2026-11-10&limit=10" \
                   "https://api.nasdaq.com/api/quote/NVDA/historical?assetclass=stocks&fromdate=2026-11-02&todate=2026-11-10&limit=10" \
                   "https://query1.finance.yahoo.com/v8/finance/chart/%5EKS11?range=7d&interval=1d" \
                   "https://m.stock.naver.com/api/index/KOSPI/price?pageSize=5&page=1" \
                   "https://indexes.nikkei.co.jp/en/nkave/index/profile?idx=nk225"; do
            echo "== $u"; curl -sS -m 25 -A "$UA" -H "Accept: application/json, text/plain, */*" -w "\n[http %{http_code} bytes %{size_download}]\n" "$u" | tail -c 700 | tr -d '\r' | tail -n 9
          done
