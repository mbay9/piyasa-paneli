name: tani
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import update as U, yfinance as yf, json, datetime as dt
          for s in ("SPY", "QQQ", "XLK", "NVDA", "MU", "AAPL"):
              j = json.loads(U.http_get(f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?range=5d&interval=1d", tries=2).text)["chart"]["result"][0]
              m, q = j["meta"], j["indicators"]["quote"][0]
              print(s, [dt.datetime.fromtimestamp(t, dt.timezone.utc).strftime("%m-%d %H:%M") for t in j["timestamp"][-2:]], q["close"][-2:], q["open"][-2:], "rmp", m.get("regularMarketPrice"), "rmt", dt.datetime.fromtimestamp(m.get("regularMarketTime"), dt.timezone.utc).strftime("%m-%d %H:%M"), "prev", m.get("chartPreviousClose"))
          PY
