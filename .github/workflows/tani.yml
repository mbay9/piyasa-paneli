name: tani
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for u in "https://indexes.nikkei.co.jp/nkave/historical/nikkei_stock_average_daily_en.csv" "https://m.stock.naver.com/api/index/KOSPI/price?pageSize=3&page=1" \
                   "https://api.nasdaq.com/api/quote/COMP/historical?assetclass=index&fromdate=2026-11-02&todate=2026-11-10&limit=10" "https://api.nasdaq.com/api/quote/SPX/historical?assetclass=index&fromdate=2026-11-02&todate=2026-11-10&limit=10" \
                   "https://api.nasdaq.com/api/quote/SPY/info?assetclass=etf" "https://api.nasdaq.com/api/quote/ONEQ/info?assetclass=etf" \
                   "https://www.cboe.com/us/equities/market_statistics/book/SPY/?json" "https://cdn.cboe.com/api/global/delayed_quotes/quotes/SPY.json" "https://cdn.cboe.com/api/global/delayed_quotes/quotes/_SPX.json" "https://cdn.cboe.com/api/global/delayed_quotes/quotes/ONEQ.json"; do
            echo "== $u"; curl -sS --http1.1 -m 25 -A "$UA" -H "Accept: application/json, text/plain, */*" -w "\n[http %{http_code} bytes %{size_download}]\n" "$u" | head -c 900 | tr -d '\r' 
          done
          echo "== FRED"; curl -sS --http1.1 -m 25 -A "Mozilla/5.0" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500&cosd=2026-10-28" | tail -n 5
          echo "== nikkei son"; curl -sS -m 25 -A "Mozilla/5.0" "https://indexes.nikkei.co.jp/nkave/historical/nikkei_stock_average_daily_en.csv" | tail -n 4
