name: EDGAR deneme
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - name: SEC erişimi
        run: |
          UA="piyasa-paneli research (github.com/mbay9/piyasa-paneli)"
          curl -s -m 30 -A "$UA" https://www.sec.gov/files/company_tickers.json -o t.json -w "tickers HTTP %{http_code}\n"
          python3 - <<'P'
          import json
          d=json.load(open("t.json"))
          for v in d.values():
              if v["ticker"] in ("LITE","MKSI","AEHR","AAPL"): print(v)
          P
          curl -s -m 30 -A "$UA" https://data.sec.gov/submissions/CIK0001633978.json -o s.json -w "submissions HTTP %{http_code}\n"
          python3 - <<'P'
          import json
          d=json.load(open("s.json"))["filings"]["recent"]
          n=0
          for i,f in enumerate(d["form"]):
              if f=="8-K":
                  print(d["filingDate"][i], d["items"][i], d["accessionNumber"][i], d["primaryDocument"][i]); n+=1
              if n>=6: break
          P
